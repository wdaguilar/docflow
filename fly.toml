app = "docflow"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  PUBLIC_URL = "https://docflow.fly.dev"
  OWNER_EMAIL = "alex@docflow.app"

# SQLite and the stored PDFs live on a persistent volume, so a redeploy
# does not wipe signed documents.
[[mounts]]
  source = "docflow_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
